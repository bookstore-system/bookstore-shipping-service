version: '3.8'

services:
  shipping-service:
    build: 
      context: .
      target: build
    container_name: shipping-service
    ports:
      - "8088:8080"
    volumes:
      - .:/build
      - ~/.m2:/root/.m2
    command: mvn spring-boot:run -Dspring-boot.run.profiles=docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      GHN_API_URL: https://dev-online-gateway.ghn.vn/shiip/public-api
      GHN_API_TOKEN: ${GHN_API_TOKEN:-demo-token}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-0}
      GHN_FROM_DISTRICT_ID: ${GHN_FROM_DISTRICT_ID:-1454}
      GHN_FROM_WARD_CODE: ${GHN_FROM_WARD_CODE:-21211}
    networks:
      - bookstore-network

networks:
  bookstore-network:
    external: true
