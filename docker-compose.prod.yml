version: '3.8'

services:
  shipping-service:
    image: truongikpk/bookstore-shipping-service:v1.0.0
    container_name: shipping-service
    ports:
      - "8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - bookstore-network

networks:
  bookstore-network:
    external: true
