bookstore:
  saga:
    enabled: ${BOOKSTORE_SAGA_ENABLED:true}
    commands-exchange: ${BOOKSTORE_SAGA_COMMANDS_EXCHANGE:bookstore.commands}
    events-exchange: ${BOOKSTORE_SAGA_EVENTS_EXCHANGE:bookstore.events}
    commands-queue: ${BOOKSTORE_SAGA_COMMANDS_QUEUE:shipping.commands.queue}
    create-retry-max: ${BOOKSTORE_SAGA_CREATE_RETRY_MAX:2}
    create-retry-delay-ms: ${BOOKSTORE_SAGA_CREATE_RETRY_DELAY_MS:1500}

spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://shipping-db:3306/bookstore_shipping?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:bookstore}
    password: ${SPRING_DATASOURCE_PASSWORD:bookstore}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}

clients:
  ghn:
    url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}

shipment:
  ghn:
    url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    apiToken: ${GHN_API_TOKEN:4149566a-b2e0-11f0-b040-4e257d8388b4}
    shopId: ${GHN_SHOP_ID:197778}
    createFallbackEnabled: ${GHN_CREATE_FALLBACK_ENABLED:true}
    shop:
      name: ${GHN_SHOP_NAME:Bookstore Shop}
      phone: ${GHN_SHOP_PHONE:0374425748}
      address: ${GHN_SHOP_ADDRESS:123 Street Name}
      ward: ${GHN_SHOP_WARD:Phường 1}
      district: ${GHN_SHOP_DISTRICT:Quận Gò Vấp}
      province: ${GHN_SHOP_PROVINCE:Hồ Chí Minh}
    address:
      fromDistrictId: ${GHN_FROM_DISTRICT_ID:1461}
      fromWardCode: ${GHN_FROM_WARD_CODE:21301}
      fromProvinceId: ${GHN_FROM_PROVINCE_ID:202}
    defaultBook:
      length: ${GHN_DEFAULT_LENGTH:20}
      width: ${GHN_DEFAULT_WIDTH:15}
      height: ${GHN_DEFAULT_HEIGHT:2}
      weight: ${GHN_DEFAULT_WEIGHT:300}
