apiVersion: v1
kind: Secret
metadata:
  name: shipping-service-secret
type: Opaque

# Example only. Do not apply this file with real values and do not commit real secrets.
# Jenkinsfile creates/updates this secret from Jenkins Credentials at deploy time.
stringData:
  SPRING_DATASOURCE_USERNAME: "[USERNAME]"
  SPRING_DATASOURCE_PASSWORD: "[PASSWORD]"
  GHN_API_TOKEN: "[GHN_API_TOKEN]"
